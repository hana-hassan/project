<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Page</title>
</head>
<body>
    <nav></nav>
    <div class="title">
        <h1>Australia GP 2025</h1>
    </div>
    <div class="top">
        <div class="general_info">
            <p>General info about race here</p>
        </div>
        <div class="ratings">
            <h4>Your Rating:</h4>
            <h4>Overall Rating:</h4>
        </div>
    </div>
    <div class="reviews">
        <h2>Reviews</h2>
        <div class="add_review">
            <form method="POST">
                <textarea placeholder="Add a review..."></textarea>
                <button type="submit">Post Review</button>
            </form>
        </div>
        <div class="all_reviews"></div>
    </div> 
</body>
</html>
