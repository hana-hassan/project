    <script>
        function showRaces(id, btn_id) {
            let list = document.getElementById(id)

            if (list.style.display === "none"){
                list.style.display = "block"
                <!--change so that the innerhtml for each season button gets changed (maybe use if statement)-->
                if (btn_id == "2026btn"){
                    document.getElementById(btn_id).innerHTML = "⮟ 2026 Season"
                } else if (btn_id == "2025btn") {
                    document.getElementById(btn_id).innerHTML = "⮟ 2025 Season"
                } else if (btn_id == "2024btn") {
                    document.getElementById(btn_id).innerHTML = "⮟ 2024 Season"
                } else if (btn_id == "2023btn"){
                    document.getElementById(btn_id).innerHTML = "⮟ 2023 Season"
                }
            } else {
                list.style.display = "none"
                
                if (btn_id == "2026btn"){
                    document.getElementById(btn_id).innerHTML = "➤ 2026 Season"
                } else if (btn_id == "2025btn") {
                    document.getElementById(btn_id).innerHTML = "➤ 2025 Season"
                } else if (btn_id == "2024btn") {
                    document.getElementById(btn_id).innerHTML = "➤ 2024 Season"
                } else {
                    document.getElementById(btn_id).innerHTML = "➤ 2023 Season"
                }
            }
        }
